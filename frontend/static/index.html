<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dietary & Weight Management Coach</title>
<!-- Google Fonts & Material Symbols -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Material+Symbols+Outlined">
<style>
  :root { 
    --accent: #10b981; 
    --accent-dark: #059669;
    --bg: #0f172a; 
    --panel: #1e293b;
    --border: #334155; 
    --text: #f8fafc;
    --text-muted: #94a3b8;
  }
  * { box-sizing:border-box; }
  body { 
    margin:0; 
    font-family:'Outfit', system-ui, -apple-system, sans-serif; 
    background:var(--bg); 
    color:var(--text);
    display:flex; 
    flex-direction:column; 
    height:100vh; 
  }
  header { 
    background:linear-gradient(135deg, #064e3b 0%, #0f172a 100%); 
    color:#fff; 
    padding:1rem 1.5rem; 
    font-size:1.25rem;
    font-weight:700; 
    display:flex;
    align-items:center;
    gap:0.75rem;
    border-bottom:1px solid var(--border);
    box-shadow: 0 4px 20px rgba(0,0,0,0.3);
  }
  header .logo-badge {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    background: linear-gradient(135deg, #10b981, #059669);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
  }

  #log { 
    flex:1; 
    overflow-y:auto; 
    padding:1.5rem; 
    max-width:850px; 
    width:100%; 
    margin:0 auto; 
    display: flex;
    flex-direction: column;
    gap: 1.25rem;
  }

  /* --- Welcome Hero State --- */
  .welcome-card {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 2rem;
    text-align: center;
    margin: 1rem 0;
    box-shadow: 0 8px 30px rgba(0,0,0,0.25);
  }
  .welcome-icon {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1rem;
    color: #fff;
    box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3);
  }
  .welcome-card h2 {
    margin: 0 0 0.5rem 0;
    font-size: 1.5rem;
    color: #34d399;
  }
  .welcome-card p {
    margin: 0;
    color: var(--text-muted);
    font-size: 1rem;
    line-height: 1.5;
  }

  /* --- Dialogue Message Layout --- */
  .msg { 
    display: flex;
    gap: 0.85rem;
    max-width: 88%;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { 
    align-self: flex-end;
    flex-direction: row-reverse; 
  }
  .msg.agent { 
    align-self: flex-start;
    flex-direction: row; 
  }

  .avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    margin-top: 1.4rem;
  }
  .msg.user .avatar {
    background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
    color: #fff;
  }
  .msg.agent .avatar {
    background: linear-gradient(135deg, #10b981 0%, #059669 100%);
    color: #fff;
  }

  .msg-content {
    display: flex;
    flex-direction: column;
    gap: 0.3rem;
  }
  .msg.user .msg-content { align-items: flex-end; }
  .msg.agent .msg-content { align-items: flex-start; }

  .msg-meta {
    font-size: 0.78rem;
    color: var(--text-muted);
    font-weight: 500;
    display: flex;
    gap: 0.5rem;
    padding: 0 0.2rem;
  }

  .bubble { 
    padding: 0.9rem 1.2rem; 
    border-radius: 18px; 
    background: var(--panel); 
    border: 1px solid var(--border); 
    color: var(--text);
    text-align: left; 
    white-space: pre-wrap; 
    line-height: 1.55;
    font-size: 0.98rem;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
  }
  .msg.user .bubble { 
    background: linear-gradient(135deg, #10b981 0%, #059669 100%); 
    color: #ffffff; 
    border: none; 
    border-top-right-radius: 4px;
  }
  .msg.agent .bubble {
    border-top-left-radius: 4px;
  }

  /* When the reply is an A2UI card, drop the bubble chrome so the card stands alone. */
  .bubble.rich { 
    background: transparent; 
    border: none; 
    padding: 0; 
    width: 100%; 
    white-space: normal; 
    box-shadow: none; 
  }

  /* Typing dots */
  .typing-dots {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 0.2rem 0.4rem;
  }
  .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .dot:nth-child(1) { animation-delay: -0.32s; }
  .dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: scale(0); }
    40% { transform: scale(1); }
  }

  .prompts-container {
    display: flex;
    gap: 0.6rem;
    padding: 0.6rem 1.2rem;
    max-width: 850px;
    width: 100%;
    margin: 0 auto;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .prompts-container::-webkit-scrollbar { display: none; }
  .prompt-chip {
    background: var(--panel);
    color: #34d399;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 0.5rem 0.95rem;
    font-size: 0.85rem;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
    box-shadow: 0 2px 6px rgba(0,0,0,0.15);
  }
  .prompt-chip:hover {
    background: #0f172a;
    border-color: var(--accent);
    color: #ffffff;
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
  }

  form { 
    display:flex; 
    gap:.75rem; 
    padding:1.2rem; 
    border-top:1px solid var(--border); 
    background:var(--panel); 
    max-width:850px;
    width:100%;
    margin:0 auto;
    border-radius:16px 16px 0 0;
  }
  input { 
    flex:1; 
    padding:.8rem 1.1rem; 
    border:1px solid var(--border); 
    border-radius:10px; 
    font-size:1rem; 
    background:#0f172a;
    color:var(--text);
    outline:none;
    transition:border-color 0.2s;
  }
  input:focus {
    border-color:var(--accent);
  }
  button { 
    padding:.8rem 1.4rem; 
    border:none; 
    border-radius:10px; 
    background:linear-gradient(135deg, #10b981 0%, #059669 100%); 
    color:#fff; 
    font-size:1rem;
    font-weight:600; 
    cursor:pointer; 
    transition:opacity 0.2s, transform 0.1s;
  }
  button:hover { opacity:0.92; }
  button:active { transform:scale(0.98); }

  /* --- A2UI component styles --- */
  .a2card { border:1px solid var(--border); border-radius:16px; padding:1.25rem; background:var(--panel); color:var(--text); box-shadow:0 4px 16px rgba(0,0,0,.25); max-width:100%; }
  .a2card + .a2card, .a2col > .a2card { margin-top:.6rem; }
  .a2col { display:flex; flex-direction:column; gap:.5rem; }
  .a2row { display:flex; flex-direction:row; gap:.6rem; align-items:center; flex-wrap:wrap; }
  .a2row.between { justify-content:space-between; }
  .a2text { margin:0; line-height:1.5; color:var(--text); }
  .a2text.a2-h1 { font-size:1.6rem; font-weight:700; color:#34d399; }
  .a2text.a2-h2 { font-size:1.3rem; font-weight:700; color:#34d399; }
  .a2text.a2-h3 { font-size:1.15rem; font-weight:600; }
  .a2text.a2-h4 { font-size:1rem; font-weight:600; }
  .a2text.a2-caption { font-size:.85rem; color:var(--text-muted); }
  .a2divider { border:none; border-top:1px solid var(--border); margin:.5rem 0; width:100%; }
  .a2img { max-width:100%; border-radius:12px; display:block; border:1px solid var(--border); margin-top:0.4rem; }
  .material-symbols-outlined { font-family:'Material Symbols Outlined'; font-size:1.25rem; line-height:1; vertical-align:middle; color:var(--accent); }
</style>
</head>
<body>
<header>
  <div class="logo-badge"><span class="material-symbols-outlined" style="color:#fff;">eco</span></div>
  <div>Dietary & Weight Management Coach</div>
</header>

<div id="log">
  <div class="welcome-card" id="welcome">
    <div class="welcome-icon"><span class="material-symbols-outlined" style="font-size:2rem;">nutrition</span></div>
    <h2>Welcome to your Dietary & Weight Coach!</h2>
    <p>I can help you calculate your BMI, estimate daily calorie budgets, lookup foods in the nutrition chart, and generate meal plate photos.</p>
  </div>
</div>

<div class="prompts-container">
  <button type="button" class="prompt-chip" data-prompt="Calculate my BMI for 70 kg, 175 cm, age 30 male">📊 Calculate BMI & Calorie Target</button>
  <button type="button" class="prompt-chip" data-prompt="Consult the nutrition chart for high-protein foods under 200 calories">🥗 Search Nutrition Chart</button>
  <button type="button" class="prompt-chip" data-prompt="Generate a photo of a healthy Mediterranean meal plate with grilled salmon and quinoa">🖼️ Generate Meal Plate Photo</button>
</div>

<form id="form">
  <input id="input" placeholder="Ask about calories, calculate BMI, log meals, generate food images..." autocomplete="off" autofocus>
  <button>Send</button>
</form>

<script>
const log = document.getElementById("log");
const welcome = document.getElementById("welcome");
const form = document.getElementById("form");
const input = document.getElementById("input");

function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function getTimeString() {
  return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function bubble(who) {
  if (welcome && welcome.parentNode) {
    welcome.parentNode.removeChild(welcome);
  }
  const isUser = who === "user";
  
  const m = el("div", "msg " + who);
  
  const avatar = el("div", "avatar");
  const icon = el("span", "material-symbols-outlined", isUser ? "person" : "eco");
  avatar.appendChild(icon);
  
  const content = el("div", "msg-content");
  
  const meta = el("div", "msg-meta");
  const nameSpan = el("span", null, isUser ? "You" : "Dietary Coach");
  const timeSpan = el("span", null, getTimeString());
  meta.appendChild(nameSpan);
  meta.appendChild(timeSpan);
  
  const b = el("div", "bubble");
  
  content.appendChild(meta);
  content.appendChild(b);
  
  m.appendChild(avatar);
  m.appendChild(content);
  
  log.appendChild(m); 
  log.scrollTop = log.scrollHeight;
  return b;
}

document.querySelectorAll(".prompt-chip").forEach(btn => {
  btn.addEventListener("click", () => {
    input.value = btn.getAttribute("data-prompt");
    form.dispatchEvent(new Event("submit", { cancelable: true }));
  });
});

/* ----------------------------------------------------------------------------
 * A2UI mini-renderer (v0.8 Basic Catalog subset).
 * -------------------------------------------------------------------------- */

function boundStr(v) {
  if (v == null) return "";
  if (typeof v === "string") return v;
  if (typeof v.literalString === "string") return v.literalString;
  return "";
}

function childIds(props) {
  const ids = [];
  if (props && typeof props.child === "string") ids.push(props.child);
  const ch = props && props.children;
  if (ch && Array.isArray(ch.explicitList)) for (const c of ch.explicitList) if (typeof c === "string") ids.push(c);
  return ids;
}

function iconName(n) { return String(n || "").replace(/([a-z0-9])([A-Z])/g, "$1_$2").replace(/\s+/g, "_").toLowerCase(); }

function buildNode(id, comps, seen) {
  if (!id || seen.has(id)) return null;
  seen.add(id);
  const spec = comps[id];
  if (!spec || typeof spec !== "object") return null;
  const type = Object.keys(spec)[0];
  const props = spec[type] || {};
  const kids = () => childIds(props).map(cid => buildNode(cid, comps, seen)).filter(Boolean);

  switch (type) {
    case "Card": {
      const d = el("div", "a2card"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Column":
    case "List": {
      const horizontal = type === "List" && props.direction === "horizontal";
      const d = el("div", horizontal ? "a2row" : "a2col"); kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Row": {
      const d = el("div", "a2row" + (props.distribution === "spaceBetween" ? " between" : ""));
      kids().forEach(n => d.appendChild(n)); return d;
    }
    case "Text": {
      const t = el("div", "a2text");
      const hint = String(props.usageHint || "body").toLowerCase();
      if (["h1", "h2", "h3", "h4", "h5", "h6"].includes(hint)) t.classList.add("a2-" + hint);
      else if (hint === "caption") t.classList.add("a2-caption");
      t.textContent = boundStr(props.text);
      return t;
    }
    case "Divider":
      return el("hr", "a2divider");
    case "Image": {
      const src = boundStr(props.url || props.src);
      if (!/^https?:\/\//i.test(src)) return null;
      const img = el("img", "a2img"); img.src = src; img.alt = boundStr(props.alt) || ""; return img;
    }
    case "Icon": {
      const s = el("span", "material-symbols-outlined"); s.textContent = iconName(boundStr(props.name) || props.name); return s;
    }
    default:
      return null;
  }
}

function renderSurface(messages, container) {
  const comps = {};
  const roots = [];
  for (const m of messages) {
    if (m.beginRendering && typeof m.beginRendering.root === "string") roots.push(m.beginRendering.root);
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.id && c.component) comps[c.id] = c.component;
  }
  let rootIds = roots.filter(r => comps[r]);
  if (rootIds.length === 0) {
    const referenced = new Set();
    for (const id in comps) { const spec = comps[id]; childIds(spec[Object.keys(spec)[0]] || {}).forEach(c => referenced.add(c)); }
    rootIds = Object.keys(comps).filter(id => !referenced.has(id));
  }
  let drew = false;
  for (const rid of rootIds) { const node = buildNode(rid, comps, new Set()); if (node) { container.appendChild(node); drew = true; } }
  return drew;
}

function flattenText(messages) {
  const out = [];
  for (const m of messages) {
    const su = m.surfaceUpdate;
    if (su && Array.isArray(su.components)) for (const c of su.components) if (c && c.component && c.component.Text) out.push(boundStr(c.component.Text.text));
  }
  return out.join("\n").trim();
}

function renderReply(b, parts) {
  b.textContent = "";
  const texts = parts.filter(p => p && (p.kind === "text" || (!p.kind && p.text))).map(p => p.text || "");
  const a2ui = parts.filter(p => p && p.kind === "a2ui" && p.data).map(p => p.data);

  const textStr = texts.join("\n").trim();
  if (textStr) {
    b.appendChild(el("div", null, textStr));

    // Auto-detect MP4 video URLs in text and embed inline video player
    const mp4Match = textStr.match(/https?:\/\/[^\s"']+\.mp4[^\s"']*/i);
    if (mp4Match) {
      const v = document.createElement("video");
      v.className = "a2img";
      v.src = mp4Match[0];
      v.controls = true;
      v.autoplay = false;
      v.style.marginTop = "0.6rem";
      v.style.maxHeight = "360px";
      v.style.width = "100%";
      b.appendChild(v);
    }
  }

  if (a2ui.length) {
    b.classList.add("rich");
    if (!renderSurface(a2ui, b)) b.appendChild(el("div", null, flattenText(a2ui) || "(no card content)"));
  }
  if (!b.childNodes.length) b.textContent = "(no response)";
  log.scrollTop = log.scrollHeight;
}

form.addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  bubble("user").textContent = text;
  input.value = "";
  
  const b = bubble("agent"); 
  b.innerHTML = '<div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
  
  try {
    const res = await fetch("/chat", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: text }) });
    const raw = await res.text();
    let data;
    try { data = JSON.parse(raw); }
    catch { throw new Error(`Server returned non-JSON (HTTP ${res.status}). ${raw.slice(0, 300)}`); }
    renderReply(b, data.parts || []);
  } catch (e) {
    b.textContent = "Error: " + e.message;
  }
});
</script>
</body>
</html>
